segments:
  - name: Maintenance and Construction
    description: >-
      Maintenance, construction, modification, and outage services for nuclear,
      fossil, and renewable power generation, plus chemical and industrial
      plants. Capabilities include welding, scaffolding, insulation,
      radiological protection, and turnkey plant services.
  - name: Munitions
    description: >-
      Ammunition manufacturing, loading, assembly, packing, storage, and
      demilitarization for the U.S. Department of Defense. Day & Zimmermann
      operates the Lake City Army Ammunition Plant in Independence, Missouri
      under a government-owned contractor-operated (GOCO) arrangement, producing
      small caliber ammunition (5.56mm, 7.62mm, .50 caliber) for the U.S. Army.
      Additional product lines include medium caliber rounds, warheads, fuzes,
      and direct/indirect fire munitions.
  - name: Government Services
    description: >-
      Integrated security services, explosive ordnance disposal (EOD), facility
      management, architecture, engineering, and commissioning for U.S.
      government agencies and federal installations.
  - name: Workforce Solutions (Yoh)
    description: >-
      STEM staffing and talent placement operated through Yoh, a Day &
      Zimmermann company. Service lines include IT, engineering, life sciences,
      and healthcare staffing, along with RPO (Recruitment Process
      Outsourcing), MSP (Managed Service Provider), and EOR (Employer of
      Record) workforce models. Yoh maintains 6,000+ active contractors.
