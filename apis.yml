description: >-
  Day & Zimmermann is a privately held, family-owned diversified industrial
  services company founded in 1901 and headquartered in Philadelphia,
  Pennsylvania. The company operates across four primary business segments —
  Maintenance & Construction (power, nuclear, fossil, renewable, and chemical
  plants), Munitions (ammunition manufacturing, storage, and demilitarization
  for the U.S. military, including operation of the Lake City Army Ammunition
  Plant), Government Services (security, EOD, facility management, and
  architecture/engineering for federal agencies), and Workforce Solutions
  (staffing and talent placement via Yoh). The Yoh family has controlled the
  company since 1961; Harold L. Yoh III serves as Chairman and CEO. Day &
  Zimmermann reported approximately $2.7 billion in revenue in 2023 with
  roughly 43,000–52,000 employees across approximately 150 global locations.
  Day & Zimmermann does not publish any public developer APIs; its business is
  delivered through long-cycle service contracts, government-owned
  contractor-operated (GOCO) facilities, and direct client engagements.
